<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.hack//Rebirth OS Interface</title>
    
    <!-- Fuente similar para títulos y datos técnicos -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS EXCLUSIVOS .HACK//REBIRTH --- */
        :root {
            --rebirth-bg-gray: #d0d0d2;
            --rebirth-bg-gray-dark: #b8b8ba;
            --rebirth-red: #8f0c2a;
            --rebirth-cyan-panel: rgba(85, 190, 215, 0.45);
            --rebirth-white: #ffffff;
            --rebirth-new-yellow: #f5f14a;
            --rebirth-text-muted: #505050;
            --font-gu-title: 'Orbitron', sans-serif;
            --font-gu-body: 'Exo 2', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--rebirth-bg-gray);
            font-family: var(--font-gu-body);
            color: var(--rebirth-white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Patrón de fondo (Curvas y Líneas Rojas) */
        .rebirth-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: 
                /* Línea roja 1 */
                linear-gradient(rgba(143, 12, 42, 0) 50%, var(--rebirth-red) 50%, rgba(143, 12, 42, 0) 51%) 100px 50% / 100% 1px no-repeat,
                /* Línea roja 2 (diagonal) */
                linear-gradient(45deg, rgba(143, 12, 42, 0) 48%, var(--rebirth-red) 50%, rgba(143, 12, 42, 0) 52%) 50% 50% / 100% 100% no-repeat;
        }

        /* Formas curvas oscuras del fondo */
        .rebirth-background::after {
            content: "";
            position: absolute;
            bottom: -150px; right: -150px;
            width: 800px; height: 800px;
            background: var(--rebirth-bg-gray-dark);
            border-radius: 50%;
            z-index: -1;
        }

        .rebirth-background::before {
            content: "";
            position: absolute;
            bottom: -50px; right: -50px;
            width: 500px; height: 500px;
            background: var(--rebirth-bg-gray);
            border-radius: 50%;
            z-index: 1;
        }

        /* --- DIAL CENTRAL INFERIOR "THE WORLD" --- */
        .gu-main-dial-container {
            position: absolute;
            bottom: 60px;
            left: 300px; /* Ajuste para centrar el dial en la imagen */
            z-index: 10;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }

        .gu-dial {
            width: 180px; height: 180px;
            background: #e0e0e0;
            border: 15px solid #d0d0d2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .gu-dial-white-ring {
            width: 140px; height: 140px;
            background: var(--rebirth-white);
            border-radius: 50%;
            border: 2px solid #505050;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gu-dial-text {
            font-family: var(--font-gu-title);
            font-size: 1.3rem;
            color: var(--rebirth-red);
            font-weight: bold;
            text-align: center;
            margin-top: -10px;
        }

        .gu-dial-arrow {
            position: absolute;
            top: -10px;
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #a0cf00; /* Flecha verde */
        }

        /* --- VENTANA DE DATOS FLOTANTE (CIAN) --- */
        .gu-info-panel {
            position: absolute;
            top: 250px;
            right: 200px;
            z-index: 20;
            width: 480px;
            height: 250px;
            background: var(--rebirth-cyan-panel);
            backdrop-filter: blur(2px);
            padding: 30px;
            border-radius: 2px;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.1);
        }

        .gu-info-title {
            font-family: var(--font-gu-body);
            font-size: 2.8rem;
            color: var(--rebirth-white);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .gu-info-text {
            font-family: var(--font-gu-body);
            font-size: 0.8rem;
            color: var(--rebirth-white);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .gu-info-subtext {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-family: var(--font-gu-body);
            font-size: 0.7rem;
            color: var(--rebirth-white);
        }

        .gu-info-id {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-family: var(--font-gu-title);
            font-size: 1.2rem;
            color: var(--rebirth-white);
        }

        /* --- ICONOS FLOTANTES --- */
        .gu-icon-container {
            position: absolute;
            z-index: 5;
        }

        .gu-icon-circle {
            width: 50px; height: 50px;
            background: #808080;
            border-radius: 50%;
            border: 2px solid var(--rebirth-white);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            position: relative;
        }

        .gu-icon-image {
            width: 30px;
            height: 30px;
        }

        /* Etiqueta "NEW" */
        .gu-label-new {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: #000000;
            background: var(--rebirth-new-yellow);
            padding: 1px 6px;
            border-radius: 2px;
            font-family: var(--font-gu-title);
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* --- POSICIONAMIENTO DE ICONOS --- */
        /* Icono Herramientas (arriba izquierda) */
        .gu-icon-tools {
            top: 250px;
            left: 100px;
        }

        /* Icono Película / NEW (arriba izquierda) */
        .gu-icon-film {
            top: 180px;
            left: 280px;
        }

        /* Icono Katana (arriba derecha) */
        .gu-icon-katana {
            top: 300px;
            right: 150px;
        }

        /* Icono Correo / NEW (abajo derecha) */
        .gu-icon-mail {
            bottom: 250px;
            right: 100px;
        }

        /* Icono Chat / NEW (abajo centro) */
        .gu-icon-chat {
            bottom: 100px;
            left: 600px;
        }

        /* Icono Perfil / NEW (abajo izquierda) */
        .gu-icon-profile {
            bottom: 100px;
            left: 100px;
        }

    </style>
</head>
<body>

    <!-- Dial Central -->
